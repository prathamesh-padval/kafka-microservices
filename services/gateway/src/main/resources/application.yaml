server:
  port: 8082

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: producer
          uri: http://producer:8081
          predicates:
            - Path=/api/produce/**
        - id: consumer
          uri: http://consumer:8080
          predicates:
            - Path=/api/consume/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
